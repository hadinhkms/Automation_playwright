name: Playwright Checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: "e2e"
        type: choice
        options:
          - check
          - e2e
          - smoke
          - regression
      env:
        description: "Environment"
        required: true
        default: "qc"
        type: choice
        options:
          - dev
          - qc
          - prod

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Print tool versions
      run: |
        node --version
        npm --version
    - name: Install dependencies
      run: npm ci
    - name: Run framework structure checks
      run: npm run check:framework
    - name: Run unit tests
      run: node --test
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright Tests
      env:
        NODE_ENV: qc
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          npm run suite:${{ github.event.inputs.suite }}
        else
          npm run suite:smoke
        fi
    - name: Notify Discord
      if: always()
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$DISCORD_WEBHOOK_URL" ]; then
          echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
          exit 0
        fi

        node -e "
          (async () => {
            try {
              const fs = require('fs');
              const cfgPath = './core/config/dashboardConfig.json';
              let discord = {};
              if (fs.existsSync(cfgPath)) {
                discord = JSON.parse(fs.readFileSync(cfgPath, 'utf8')).discord || {};
              }
              if (discord.notifyOnFinish === false) {
                console.log('Discord notification is disabled (notifyOnFinish: false); skipping.');
                process.exit(0);
              }
              if (discord.notifyOnlyOnFailure && '${{ job.status }}' !== 'failure') {
                console.log('notifyOnlyOnFailure is enabled and status is ${{ job.status }}; skipping.');
                process.exit(0);
              }
              const isPassed = '${{ job.status }}' === 'success';
              const color = isPassed ? 0x22c55e : 0xef4444;
              const emoji = isPassed ? '✅' : '❌';
              const embed = {
                title: emoji + ' GitHub Actions CI: Playwright Checks',
                color: color,
                description: 'Kết quả kiểm thử tự động từ GitHub Actions workflow.',
                fields: [
                  { name: '📊 Trạng thái', value: '\`${{ job.status }}\`', inline: true },
                  { name: '📦 Báo cáo / Artifacts', value: '[Xem chi tiết trên GitHub](' + process.env.RUN_URL + ')', inline: false }
                ],
                footer: { text: '@hadinhkms/qa-automation-engine • ' + new Date().toLocaleString('vi-VN') }
              };
              const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [embed] })
              });
              if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
              console.log('Discord notification sent successfully.');
            } catch (err) {
              console.error('Error sending Discord notification:', err.message);
            }
          })();
        "
