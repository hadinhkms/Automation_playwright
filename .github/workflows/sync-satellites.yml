name: Auto Sync Framework to Satellites

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'core/**'
      - 'bin/**'
      - 'scripts/**'
      - 'ai/**'
      - 'tools/**'
      - 'Start_Dashboard.bat'
      - 'Stop_Dashboard.bat'
  workflow_dispatch:

jobs:
  sync-satellites:
    name: Sync to Vieclam24h & CarThings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Hub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hub Dependencies
        run: npm ci || npm install --prefer-offline

      - name: Run Hub-to-Spoke Synchronization
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT || secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: node scripts/sync-satellites.js